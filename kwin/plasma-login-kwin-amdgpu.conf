[Service]
# amdgpu advertises DRM_FORMAT_RGBA8888 (RA24) in rgb_formats[] and
# overlay_formats[] but fill_plane_buffer_attributes() has no case for it, so
# the atomic commit fails and KWin retries until it wedges. The login greeter
# runs its own KWin as user plasmalogin, outside the session's env.sh, so it
# needs the same workaround here. Overlays on keeps KWin on the primary plane.
#
# Upstream ships Environment="KWIN_USE_OVERLAYS=0" in this unit, but KWin
# parses that variable as "value == 1", so 0 means unset, not off. A drop-in
# Environment= line replaces it.
#
# Drop this drop-in when upstream adds the missing case.
Environment="KWIN_USE_OVERLAYS=1"
