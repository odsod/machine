# Herdr Configuration
# Symlinked to ~/.config/herdr/config.toml

onboarding = false

[theme]
name = "nord"
auto_switch = false

[theme.custom]
accent = "#5E81AC" # nord10: focused borders, active highlights
panel_bg = "#2E3440" # nord0: panel/popup backgrounds
surface0 = "#3B4252" # nord1: selected row background (navigate mode)
surface1 = "#434C5E" # nord2: hover/secondary selection
surface_dim = "#3B4252" # nord1: active agent row bg, separators (matches fzf bg+)
overlay0 = "#7B88A1" # brighter mid-tone: secondary text, agent subtitles, branch names
overlay1 = "#9BA4B5" # brighter still: emphasis secondary
text = "#ECEFF4" # nord6: primary text
subtext0 = "#D8DEE9" # nord4: slightly muted primary text
mauve = "#B48EAD" # nord15: aurora purple, branch names when active
green = "#81A1C1" # nord9 blue: git ahead, idle/done state
yellow = "#EBCB8B" # nord13: working state (amber, no attention needed)
red = "#BF616A" # nord11: blocked state, git behind
blue = "#5E81AC" # nord10: notifications, done dot (darker blue)
teal = "#5E81AC" # nord10: done (unseen) state (darker blue)
peach = "#D08770" # nord12: aurora orange (unused currently)
[terminal]
new_cwd = "follow"

[ui]
prompt_new_workspace_name = true
mouse_scroll_lines = 3
agent_panel_sort = "spaces"
tab_bar_position = "top"
pane_scrollbars = false
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
pane_history = true

[advanced]
scrollback_limit_bytes = 10000000

[keys]
prefix = "ctrl+u"

# Pane navigation (vim-style, ctrl held after prefix)
focus_pane_left = "prefix+ctrl+h"
focus_pane_down = "prefix+ctrl+j"
focus_pane_up = "prefix+ctrl+k"
focus_pane_right = "prefix+ctrl+l"

# Splits
split_horizontal = "prefix+ctrl+s"
split_vertical = "prefix+ctrl+v"

# Pane management
close_pane = "prefix+ctrl+d"
zoom = "prefix+ctrl+z"

# Tab navigation
next_tab = "prefix+ctrl+n"
previous_tab = "prefix+ctrl+b"
new_tab = "prefix+ctrl+w"
rename_tab = "prefix+ctrl+m"

# Workspace navigation
goto = "prefix+ctrl+f"

# Copy mode
copy_mode = "prefix+ctrl+r"

# Detach
detach = "prefix+ctrl+q"

# Session picker popup
[[keys.command]]
key = "prefix+ctrl+t"
command = "start-workspace"
type = "popup"
width = 72
height = 28
description = "Session Picker"

# Clone repo popup
[[keys.command]]
key = "prefix+ctrl+o"
command = "clone-repo"
type = "popup"
width = 72
height = 28
description = "Clone Repository"

# Jujutsu status
[[keys.command]]
key = "prefix+ctrl+g"
command = "jj status"
type = "popup"
width = "85%"
height = "85%"
description = "Jujutsu Status"

# Recorder toggle
[[keys.command]]
key = "prefix+ctrl+x"
command = "recorder-toggle-herdr"
type = "shell"
description = "Toggle Recorder"

# URL picker
[[keys.command]]
key = "prefix+ctrl+c"
command = "herdr-url-picker"
type = "popup"
width = 80
height = 20
description = "URL Picker"
