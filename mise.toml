[settings]
idiomatic_version_file_enable_tools = ["go", "java", "node", "python", "ruby", "terraform"]
lockfile = true
minimum_release_age = "0s"
pin = false
trusted_config_paths = ["~/Activities", "~/Code", "~/Projects", "~/Workspaces"]

[settings.python]
uv_venv_auto = "source"

[settings.status]
missing_tools = "if_other_versions_installed"
show_env = false
show_tools = false

[settings.task]
output = "prefix"
run_auto_install = true

[tools]
"aqua:jdx/mise" = "latest"

# Languages: major prefixes, not latest (avoids silent 24→26 / 3.12→3.14)
go = "1.26"
node = "24"
python = "3.12"

# Go tools
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:mvdan.cc/gofumpt" = "latest"

# Core CLI tools
buf = "latest"
claude = "latest"
codex = "latest"
eza = "latest"
fzf = "latest"
gemini = "latest"
gh = "latest"
hyperfine = "latest"
jj = "latest"
neovim = { version = "latest", postinstall = """
sudo dnf remove -y vim-enhanced vim-minimal 2>/dev/null || true
nvim --headless '+lua vim.pack.update(nil, { force = true })' +qa
nvim_path="$(mise where neovim)/bin/nvim"
ln -fsT "$nvim_path" "$HOME/.local/bin/vim"
ln -fsT "$nvim_path" "$HOME/.local/bin/vi"
""" }
opencode = "latest"
"github:can1357/oh-my-pi" = { version = "latest", exe = "omp" }
ruff = "latest"
starship = "latest"
usage = "latest"

# Language servers and linters
lua-language-server = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"

# npm tools
"npm:@typescript/native-preview" = "7.0.0-dev.20260707.2"
"npm:agent-browser" = "latest"
"npm:bash-language-server" = "latest"
"npm:defuddle" = "latest"
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:pnpm" = "latest"
"npm:typescript" = "latest"
"npm:yaml-language-server" = "latest"

# Tools via GitHub releases
"github:backnotprop/plannotator" = "latest"
"github:dmmulroy/jj-starship" = "latest"
"github:Feel-ix-343/markdown-oxide" = "latest"
"github:fish-shell/fish-shell" = { version = "latest", exe = "fish" }
"github:googleworkspace/cli" = { version = "latest", exe = "gws" }
"github:ludviglundgren/qbittorrent-cli" = { version = "latest", exe = "qbt" }
"github:odsod/recorder" = "latest"
"github:traefik/yaegi" = "latest"

# Desktop/infra tools
antigravity-cli = "latest"
awscli = "latest"
fx = "latest"
gcloud = "latest"
herdr = "latest"
jwt = "latest"
spacectl = "latest"

# Python tools (via pipx backend)
"pipx:idasen" = "latest"
"pipx:ty" = "latest"

[env]
_.source = "{{config_root}}/env.sh"

[settings.dotfiles]
root = "{{config_root}}"

