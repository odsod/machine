[settings]
idiomatic_version_file_enable_tools = ["go", "java", "node", "python", "ruby", "terraform"]
minimum_release_age = "3d"
pin = true
trusted_config_paths = ["~/Activities", "~/Code", "~/Projects", "~/Workspaces"]

[settings.python]
uv_venv_auto = "source"

[settings.status]
missing_tools = "if_other_versions_installed"
show_env = false
show_tools = false

[settings.task]
output = "prefix"
run_auto_install = true

[tools]
# Languages
go = "1.26.5"
node = "24"
python = "3.12"

# Go tools
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:honnef.co/go/tools/cmd/staticcheck" = "2026.1"
"go:mvdan.cc/gofumpt" = "0.11.0"

# Core CLI tools
buf = "1.72.0"
claude = "2.1.226"
codex = "0.147.0"
eza = "0.23.5"
fzf = "0.74.2"
gemini = "0.54.4"
gh = "2.97.0"
hyperfine = "1.20.0"
jj = "0.44.0"
neovim = { version = "0.12.4", postinstall = "nvim --headless '+lua vim.pack.update(nil, { force = true })' +qa" }
ruff = "0.16.2"
starship = "1.26.0"
tmux = "3.7b"

# Language servers and linters
lua-language-server = "3.19.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
stylua = "2.5.2"

# npm tools
"npm:@typescript/native-preview" = "7.0.0-dev.20260707.2"
"npm:agent-browser" = "0.33.2"
"npm:bash-language-server" = "5.6.0"
"npm:defuddle" = "0.19.2"
"npm:oxfmt" = "0.62.0"
"npm:oxlint" = "1.77.0"
"npm:pnpm" = "11.20.0"
"npm:typescript" = "7.0.2"
"npm:yaml-language-server" = "1.24.0"

# Tools via GitHub releases
"github:backnotprop/plannotator" = "0.26.4"
"github:dmmulroy/jj-starship" = "0.7.1"
"github:Feel-ix-343/markdown-oxide" = "0.25.12"
"github:fish-shell/fish-shell" = { version = "4.8.1", exe = "fish" }
"github:googleworkspace/cli" = { version = "0.22.5", exe = "gws" }
"github:ludviglundgren/qbittorrent-cli" = { version = "2.3.0", exe = "qbt" }
"github:odsod/recorder" = "2026.8.1"
"github:traefik/yaegi" = "0.16.1"

# Desktop/infra tools
antigravity-cli = "1.1.11"
awscli = "2.36.19"
fx = "39.2.0"
gcloud = "579.0.0"
herdr = "0.8.0"
jwt = "6.2.0"
spacectl = "1.24.0"

# Python tools (via pipx backend)
"pipx:idasen" = "0.13.1"
"pipx:ty" = "0.0.69"

[env]
_.source = "{{config_root}}/env.sh"

[settings.dotfiles]
root = "{{config_root}}"

