[tasks."setup:kwallet"]
description = "Configure KWallet"
run = """
mkdir -p ~/.config
printf '%s\n' '[Wallet]' 'Enabled=true' 'First Use=false' > ~/.config/kwalletrc
"""

[tasks."setup:keyboard"]
description = "Install custom XKB keyboard layout"
run = """
repo="$(dirname "$(readlink -f ~/.config/mise/config.toml)")"
sudo cp "$repo/keyboard/odsod" /usr/share/X11/xkb/symbols/odsod
grep -q odsod /usr/share/X11/xkb/rules/evdev.xml || \
  sudo sed -i 's#</layoutList>#<layout><configItem><name>odsod</name><languageList><iso639Id>eng</iso639Id></languageList></configItem></layout></layoutList>#' \
  /usr/share/X11/xkb/rules/evdev.xml
"""

[tasks."setup:codex"]
description = "Sync codex config (preserves trusted dirs and hook state)"
run = """
repo="$(dirname "$(readlink -f ~/.config/mise/config.toml)")"
python3 "$repo/codex/sync-config.py" sync --base "$repo/codex/config.toml" --target "$HOME/.codex/config.toml"
"""

[tasks."codex:diff"]
description = "Show diff between repo codex config and live config"
run = """
repo="$(dirname "$(readlink -f ~/.config/mise/config.toml)")"
python3 "$repo/codex/sync-config.py" diff --base "$repo/codex/config.toml" --target "$HOME/.codex/config.toml"
"""

[tasks."setup:cursor-cli"]
description = "Seed cursor CLI config from repo template"
run = """
if [ ! -f "$HOME/.cursor/cli-config.json" ]; then
  repo="$(dirname "$(readlink -f ~/.config/mise/config.toml)")"
  mkdir -p "$HOME/.cursor"
  cp "$repo/cursor/cli-config.json" "$HOME/.cursor/cli-config.json"
fi
"""
