"~/.local/bin/remote-herdr" = "tailscale/remote-herdr.fish"
"~/.local/bin/jj-workflow" = "jj/workflow.fish"
"~/.local/bin/odsod-kwin-dbus-service.py" = "kwin/odsod-kwin-dbus-service.py"
"~/.local/share/dbus-1/services/io.github.odsod.kwin.service" = "kwin/io.github.odsod.kwin.service"
"~/.local/bin/plannotator" = "plannotator/plannotator"
