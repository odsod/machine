# Machine root config: mise behavior, the toolchain, and the environment.
# Every machine concern lives in a topic module under mise/conf.d/.
#
# [tools] stays here on purpose. mise anchors mise.lock to the highest-
# precedence config that defines tools, so moving them into fragments would
# relocate the lockfile to mise/mise.lock. Fragments load before this file, so a
# setting here wins on conflict.

[settings]
auto_update = true
idiomatic_version_file_enable_tools = [
  "go",
  "java",
  "node",
  "python",
  "ruby",
  "terraform",
]
# `mise upgrade` and `prune` parse every tracked config, including go.mod files
# from build artifacts and other repos. A bare `go` directive is only a floor,
# so ignore it now instead of warning until mise 2026.11.0 removes it. The
# version comes from mise.toml or go.mod's `toolchain` line.
idiomatic_version_file_ignore_minimum_versions = true
lockfile = true
minimum_release_age = "0s"
pin = false
trusted_config_paths = ["~/Activities", "~/Code", "~/Projects", "~/Workspaces"]

[settings.python]
uv_venv_auto = "source"

[settings.status]
missing_tools = "if_other_versions_installed"
show_env = false
show_tools = false

[settings.task]
output = "prefix"
run_auto_install = true

[tools]
"aqua:jdx/mise" = "latest"

# Languages: major prefixes, not latest (avoids silent 24→26 / 3.12→3.14)
go = "1.27"
node = "26"
python = "3.15"

# Go tools
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:mvdan.cc/gofumpt" = "latest"

# Core CLI tools
buf = "latest"
claude = "latest"
codex = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
hyperfine = "latest"
jj = "latest"
neovim = { version = "latest", postinstall = """
sudo dnf remove -y vim-enhanced vim-minimal 2>/dev/null || true
nvim --headless '+lua local ok, err = pcall(require("odsod.pack").update); if not ok then vim.api.nvim_err_writeln(err); vim.cmd("cquit 1") end' +qa
nvim_path="$(mise where neovim)/bin/nvim"
ln -fsT "$nvim_path" "$HOME/.local/bin/vim"
ln -fsT "$nvim_path" "$HOME/.local/bin/vi"
""" }
pi = "latest"
ruff = "latest"
usage = "latest"

# Python dependency graphs need uv >= 0.12.10; Fedora 44 ships 0.12.9, so dnf
# cannot satisfy it. dnf:uv stays for the post-packages hook that runs before
# tools are installed.
uv = "latest"
# pipx installs pipx:idasen version-only, bypassing the locked dependency graph.
pipx = "latest"

# Language servers and linters
lua-language-server = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"

# npm tools
"npm:agent-browser" = "latest"
"npm:bash-language-server" = "latest"
"npm:defuddle" = "latest"
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:pnpm" = "latest"
"npm:typescript" = "latest"
"npm:yaml-language-server" = "latest"

# Tools via GitHub releases
"github:Feel-ix-343/markdown-oxide" = "latest"
"github:fish-shell/fish-shell" = { version = "latest", exe = "fish", postinstall = { when = "always", run = """
sudo install -m 0755 "$(mise where github:fish-shell/fish-shell)/fish" /usr/local/bin/fish
""" } }
"github:googleworkspace/cli" = { version = "latest", exe = "gws" }
"github:ludviglundgren/qbittorrent-cli" = { version = "latest", exe = "qbt" }
"github:odsod/recorder" = "latest"
"github:traefik/yaegi" = "latest"

# Desktop/infra tools
antigravity-cli = "latest"
awscli = "latest"
fx = "latest"
gcloud = "latest"
herdr = "latest"
jwt = "latest"
spacectl = "latest"

# Python tools (via pipx backend)
# PyYAML ships no cp315 wheel, so idasen's locked dependency graph cannot replay
# on Python 3.15. pipx builds the sdist instead. Drop uvx = false once PyYAML
# ships a cp315 wheel and the graph locks again.
"pipx:idasen" = { version = "latest", uvx = false }

# ty is a Rust binary. Its PyPI wheel ships .data/scripts, which mise's pipx
# dependency-graph install rejects, so take the GitHub release instead.
"aqua:astral-sh/ty" = "latest"

# HTTP archive tools
"http:soap-ui" = { version = "{{vars.soap_ui_version}}", url = "https://dl.eviware.com/soapuios/{{vars.soap_ui_version}}/SoapUI-{{vars.soap_ui_version}}-linux-bin.tar.gz", strip_components = 1, bin_path = "bin", postinstall = """
ln -fsT "$(mise where http:soap-ui)/bin/soapui.sh" "$HOME/.local/bin/soap-ui"
""" }
"http:obsidian" = { version = "{{vars.obsidian_version}}", url = "https://github.com/obsidianmd/obsidian-releases/releases/download/v{{vars.obsidian_version}}/Obsidian-{{vars.obsidian_version}}.AppImage", postinstall = """
ln -fsT "$(mise where http:obsidian)/Obsidian-{{vars.obsidian_version}}.AppImage" "$HOME/.local/bin/obsidian-app"
""" }

[env]
_.source = "{{ config_source | canonicalize | dirname }}/env.sh"
REPO_DIR = "{{ config_source | canonicalize | dirname }}"

