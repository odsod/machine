[bootstrap.hooks.pre-packages]
run = [
]

[bootstrap.files."/etc/sudoers.d/odsod"]
content = "odsod ALL=(ALL) NOPASSWD: ALL\n"
owner = "root"
group = "root"
mode = "0440"

[bootstrap.files."/etc/ssh/sshd_config.d/01-odsod-machine.conf"]
source = "ssh/machine.conf"
owner = "root"
group = "root"
mode = "0644"
replace = true
notify = ["sshd"]

[bootstrap.services.sshd]
state = "running"
enabled = true

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.services.tailscaled]
state = "running"
enabled = true

[bootstrap.hooks.post-packages]
run = [
]

[bootstrap.hooks.post-tools]
run = ["mise run setup:neovim-alternatives", "mise run setup:fish-shell"]


[bootstrap.mise_shell_activate]
fish = "activate"

[tasks.bootstrap]
description = "Post-install setup: media, graphics, desktop apps, GPU services, auth"
depends = ["setup:media", "setup:graphics", "setup:desktop-apps", "setup:gpu-services"]
run = """
echo "[bootstrap] Verifying auth services..."
gh auth status 2>/dev/null || echo "  → Run: gh auth login"
tailscale status 2>/dev/null | head -1 || echo "  → Run: sudo tailscale up"
gcloud auth list --filter="status:ACTIVE" --format="value(account)" 2>/dev/null | grep -q . || echo "  → Run: gcloud auth login"
"""

[tasks."setup:media"]
description = "Install media codecs (ffmpeg swap, group upgrade)"
run = "{{config_root}}/tasks/setup-media.sh"

[tasks."setup:graphics"]
description = "Install GPU-conditional graphics drivers"
run = "{{config_root}}/tasks/setup-graphics.sh"

[tasks."setup:desktop-apps"]
description = "Install desktop apps (Slack, Zoom, Obsidian, Cursor, Zed)"
run = "{{config_root}}/tasks/setup-desktop-apps.sh"

[tasks."setup:gpu-services"]
description = "Build and install GPU inference services (llama/whisper)"
run = "{{config_root}}/tasks/setup-gpu-services.sh"

[tasks."setup:neovim-alternatives"]
description = "Remove vim packages and set up nvim as vim/vi"
run = """
sudo dnf remove -y vim-enhanced vim-minimal 2>/dev/null || true
nvim_path="$(mise where neovim)/bin/nvim"
ln -fsT "$nvim_path" "$HOME/.local/bin/vim"
ln -fsT "$nvim_path" "$HOME/.local/bin/vi"
"""

[tasks."setup:fish-shell"]
description = "Register fish in /etc/shells and set as login shell"
run = """
fish_path="$(mise where github:fish-shell/fish-shell)/fish"
stable_path="/usr/local/bin/fish"
sudo ln -fsT "$fish_path" "$stable_path"
grep -qxF "$stable_path" /etc/shells || echo "$stable_path" | sudo tee -a /etc/shells
current_shell="$(getent passwd odsod | cut -d: -f7)"
[ "$current_shell" = "$stable_path" ] || sudo chsh -s "$stable_path" odsod
"""
