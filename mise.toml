# Machine root config: mise behavior, toolchain, environment, cross-cutting
# base system state, and top-level lifecycle tasks. Topic-specific state lives
# in mise/conf.d/<topic>.toml.
#
# [tools] stays here on purpose. mise anchors mise.lock to the highest-
# precedence config that defines tools, so moving them into fragments would
# relocate the lockfile to mise/mise.lock. Fragments load before this file, so
# variables from mise/conf.d/*.toml are in scope here.

[settings]
self_update.auto = true
idiomatic_version_file_enable_tools = [
  "go",
  "java",
  "node",
  "python",
  "ruby",
  "terraform",
]
lockfile = true
# The bump flow takes releases the day they ship, so keep the cooldown off.
minimum_release_age = "0s"
trusted_config_paths = ["~/Activities", "~/Code", "~/Projects", "~/Workspaces"]

[settings.python]
uv_venv_auto = "source"

[settings.status]
show_env = false
show_tools = false

[settings.task]
output = "prefix"

[tools]
"aqua:jdx/mise" = "2026.11.7"

# Languages: major prefixes, not latest (avoids silent 24→26 / 3.12→3.14)
go = "1.27"
node = "26"
python = "3.15"

# Go tools
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:mvdan.cc/gofumpt" = "latest"

# Core CLI tools
buf = "latest"
claude = "latest"
codex = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
hyperfine = "latest"
jj = "latest"
neovim = { version = "latest", postinstall = """
sudo dnf remove -y vim-enhanced vim-minimal 2>/dev/null || true
nvim --headless '+lua local ok, err = pcall(require("odsod.pack").update); if not ok then vim.api.nvim_err_writeln(err); vim.cmd("cquit 1") end' +qa
nvim_path="$(mise where neovim)/bin/nvim"
ln -fsT "$nvim_path" "$HOME/.local/bin/vim"
ln -fsT "$nvim_path" "$HOME/.local/bin/vi"
""" }
pi = "latest"
ruff = "latest"
usage = "latest"

# Python dependency graphs need uv >= 0.12.10; Fedora 44 ships 0.12.9, so dnf
# cannot satisfy it. dnf:uv stays for the post-packages hook that runs before
# tools are installed.
uv = "latest"
# pipx installs pipx:idasen version-only, bypassing the locked dependency graph.
pipx = "latest"

# Language servers and linters
lua-language-server = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"

# npm tools
"npm:agent-browser" = "latest"
"npm:bash-language-server" = "latest"
"npm:defuddle" = "latest"
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:pnpm" = "latest"
"npm:typescript" = "latest"
"npm:yaml-language-server" = "latest"

# Tools via GitHub releases
"github:Feel-ix-343/markdown-oxide" = "latest"
"github:fish-shell/fish-shell" = { version = "latest", postinstall = { when = "always", run = """
sudo install -m 0755 "$(mise where github:fish-shell/fish-shell)/fish" /usr/local/bin/fish
""" } }
# gh runs `gh stack` only from its extension dir. A symlinked dir is a local
# extension, which `gh extension upgrade` refuses to touch.
"github:github/gh-stack" = { version = "latest", bin = "gh-stack", postinstall = { when = "always", run = """
mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/gh/extensions"
ln -fsT "$MISE_TOOL_INSTALL_PATH" "${XDG_DATA_HOME:-$HOME/.local/share}/gh/extensions/gh-stack"
""" } }
"github:googleworkspace/cli" = "latest"
"github:ludviglundgren/qbittorrent-cli" = "latest"
"github:odsod/recorder" = "latest"
"github:traefik/yaegi" = "latest"

# Desktop/infra tools
antigravity-cli = "latest"
awscli = "latest"
fx = "latest"
gcloud = "latest"
herdr = "latest"
jwt = "latest"
spacectl = "latest"

# Python tools (via pipx backend)
# PyYAML ships no cp315 wheel, so idasen's locked dependency graph cannot replay
# on Python 3.15. pipx builds the sdist instead. Drop uvx = false once PyYAML
# ships a cp315 wheel and the graph locks again.
"pipx:idasen" = { version = "latest", uvx = false }

# ty is a Rust binary. Its PyPI wheel ships .data/scripts, which mise's pipx
# dependency-graph install rejects, so take the GitHub release instead.
"aqua:astral-sh/ty" = "latest"

# Desktop downloads that mise can both fetch and version-track through the http
# backend. version_list_url lets `mise outdated` and `mise upgrade --bump` see
# them. Obsidian needs the expression because its newest releases are sometimes
# Android only.
[tools."http:soap-ui"]
version = "latest"
url = "https://dl.eviware.com/soapuios/{{ version }}/SoapUI-{{ version }}-linux-bin.tar.gz"
version_list_url = "https://www.soapui.org/downloads/latest-release/"
version_regex = 'SoapUI-(\d+\.\d+\.\d+)-linux-bin\.tar\.gz'
strip_components = 1
bin_path = "bin"
postinstall = 'ln -fsT "$(mise where http:soap-ui)/bin/soapui.sh" "$HOME/.local/bin/soap-ui"'

[tools."http:obsidian"]
version = "latest"
version_order = "semver"
url = "https://github.com/obsidianmd/obsidian-releases/releases/download/v{{ version }}/Obsidian-{{ version }}.AppImage"
version_list_url = "https://api.github.com/repos/obsidianmd/obsidian-releases/releases?per_page=20"
version_expr = 'fromJSON(body) | filter({ any(#.assets, { #.name startsWith "Obsidian-" && #.name endsWith ".AppImage" }) }) | map({ trimPrefix(#.tag_name, "v") })'
postinstall = """
ln -fsT "$(mise where http:obsidian)"/Obsidian-*.AppImage "$HOME/.local/bin/obsidian-app"
"""


# Herdr app and herdr-core: releases.herdr.dev only. latest.json names the
# newest version; manifest.json holds each target's sha256. The app still
# updates itself in place: see AGENTS.md (Herdr app) for the upstream issues.
[tools."http:herdr-core"]
version = "latest"
version_list_url = "https://releases.herdr.dev/core/latest.json"
version_json_path = ".version"
checksum_url = "https://releases.herdr.dev/core/{{ version }}/manifest.json"
checksum_expr = '"sha256:" + filter(values(fromJSON(body).targets), { #.url == url })[0].sha256'
postinstall = 'ln -fsT "$(mise where http:herdr-core)/herdr-core" "$HOME/.local/bin/hc"'

[tools."http:herdr-core".platforms]
linux-x64 = { url = "https://releases.herdr.dev/core/{{ version }}/herdr-core-linux-x86_64.tar.gz" }
linux-arm64 = { url = "https://releases.herdr.dev/core/{{ version }}/herdr-core-linux-aarch64.tar.gz" }

[tools."http:herdr-app"]
version = "latest"
version_list_url = "https://releases.herdr.dev/app/latest.json"
version_json_path = ".version"
checksum_url = "https://releases.herdr.dev/app/{{ version }}/manifest.json"
checksum_expr = '"sha256:" + filter(values(fromJSON(body).targets), { #.url == url })[0].sha256'
postinstall = """
mkdir -p "$HOME/.local/share/icons/hicolor/scalable/apps"
ln -fsT "$(mise where http:herdr-app)/herdr-app.svg" "$HOME/.local/share/icons/hicolor/scalable/apps/herdr-app.svg"
"""

[tools."http:herdr-app".platforms]
linux-x64 = { url = "https://releases.herdr.dev/app/{{ version }}/herdr-app-linux-x86_64.tar.gz" }
linux-arm64 = { url = "https://releases.herdr.dev/app/{{ version }}/herdr-app-linux-aarch64.tar.gz" }

[env]
_.source = "{{ config_source | canonicalize | dirname }}/env.sh"
REPO_DIR = "{{ config_source | canonicalize | dirname }}"

[bootstrap.packages]
# Core system tools
"dnf:bat" = "latest"
"dnf:binutils" = "latest"
"dnf:ca-certificates" = "latest"
"dnf:curl" = "latest"
"dnf:dnf5-plugins" = "latest"
"dnf:dos2unix" = "latest"
"dnf:fd-find" = "latest"
"dnf:firefox" = "latest"
"dnf:flatpak" = "latest"
"dnf:gcc-c++" = "latest"
"dnf:gifsicle" = "latest"
"dnf:gtk-layer-shell" = "latest"
"dnf:gzip" = "latest"
"dnf:hexyl" = "latest"
"dnf:htop" = "latest"
"dnf:iftop" = "latest"
"dnf:ImageMagick" = "latest"
"dnf:java-25-openjdk-devel" = "latest"
"dnf:jq" = "latest"
"dnf:keepassxc" = "latest"
"dnf:maven" = "latest"
"dnf:ncdu" = "latest"
"dnf:net-snmp-utils" = "latest"
"dnf:ngrep" = "latest"
"dnf:pciutils" = "latest"
"dnf:perl-Image-ExifTool" = "latest"
"dnf:qbittorrent" = "latest"
"dnf:ripgrep" = "latest"
"dnf:rustup" = "latest"
"dnf:simple-scan" = "latest"
"dnf:tar" = "latest"
"dnf:tree-sitter-cli" = "latest"
"dnf:ttyd" = "latest"
"dnf:unrar" = "latest"
"dnf:unzip" = "latest"
"dnf:util-linux" = "latest"
"dnf:v4l-utils" = "latest"
"dnf:wl-clipboard" = "latest"
"dnf:wtype" = "latest"
"dnf:yt-dlp" = "latest"

# PDF decoding and OCR
"dnf:poppler-utils" = "latest"
"dnf:tesseract" = "latest"
"dnf:tesseract-langpack-eng" = "latest"
"dnf:tesseract-langpack-fin" = "latest"
"dnf:tesseract-langpack-swe" = "latest"

# Flatpak
"flatpak:com.spotify.Client" = "latest"
"flatpak:hu.irl.cameractrls" = "latest"

[bootstrap.users.odsod]
group = "odsod"
groups = ["docker", "wireshark"]

[bootstrap.files."/etc/sudoers.d/odsod"]
content = "odsod ALL=(ALL) NOPASSWD: ALL\n"
owner = "root"
group = "root"
mode = "0440"

[bootstrap.files."/etc/tmpfiles.d/tmp.conf"]
content = """
# Clear tmp directories separately, to make them easier to override.
#
# /tmp sits on the encrypted root btrfs, not tmpfs: tasks/setup-tmp.sh masks
# tmp.mount. Keep one week of files. systemd-tmpfiles-clean.timer enforces the
# age 15 minutes after boot and once a day.
q /tmp 1777 root root 7d
q /var/tmp 1777 root root 30d
"""
owner = "root"
group = "root"
mode = "0644"
replace = true

[bootstrap.files."/etc/yum.repos.d/mise.repo"]
content = """
[mise-repo]
name=mise repo
baseurl=https://mise.jdx.dev/rpm
enabled=1
gpgcheck=1
gpgkey=https://mise.jdx.dev/gpg-key.pub
"""
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"
replace = true

[tasks.discover]
description = "Compare every pinned version with the latest upstream release"
env = { PINNED_SLACK = "{{vars.slack_version}}", PINNED_ZOOM = "{{vars.zoom_version}}", PINNED_YAAK = "{{vars.yaak_version}}", PINNED_LLAMA = "{{vars.llama_version}}", PINNED_WHISPER = "{{vars.whisper_version}}", PINNED_EV = "{{vars.endpoint_verification_version}}" }
run = 'exec "$REPO_DIR/tasks/discover.sh"'

[tasks.bump]
description = "Upgrade mise tools and bump every self-managed pin"
lock = "machine-apply"
run = 'exec "$REPO_DIR/tasks/bump.sh" "$@"'

[tasks.clean]
description = "Remove installed payloads and source trees other than the pinned versions"
lock = "machine-apply"
run = 'exec "$REPO_DIR/tasks/clean.sh"'

[tasks.apply]
description = "Apply every current version and config: full convergence"
lock = "machine-apply"
run = ["mise bootstrap --yes", "mise reshim", { task = "clean" }]

[tasks.bootstrap]
description = "Post-install setup: media, graphics, desktop apps, GPU services, KDE, keyboard, auth"
depends = [
  "media:setup",
  "graphics:setup",
  "slack:setup",
  "zoom:setup",
  "yaak:setup",
  "llama:setup",
  "whisper:setup",
  "swap:setup",
  "tmp:setup",
  "kde:setup-fonts",
  "kde:setup-colors",
  "kde:setup-wallpaper",
  "keyboard:setup",
  "herdr:sync-machines",
]
run = """
echo "[bootstrap] Verifying auth services..."
gh auth status 2>/dev/null || echo "  → Run: gh auth login"
tailscale status 2>/dev/null | head -1 || echo "  → Run: sudo tailscale up"
gcloud auth list --filter="status:ACTIVE" --format="value(account)" 2>/dev/null | grep -q . || echo "  → Run: gcloud auth login"
"""

[tasks."swap:setup"]
description = "Create and enable the disk swap tier"
run = 'exec "$REPO_DIR/tasks/setup-swapfile.sh"'

[tasks."tmp:setup"]
description = "Move /tmp off tmpfs onto the encrypted root"
run = 'exec "$REPO_DIR/tasks/setup-tmp.sh"'

[tasks.fmt]
description = "Format all repo files"
run = """
cd "$REPO_DIR"
# shfmt does not read .gitignore, so drop ignored trees such as src/.
shfmt --find . | git check-ignore -nv --stdin | sed -n 's/^::\t//p' | xargs shfmt -w -i 2
stylua --indent-type Spaces --indent-width 2 .
ruff check --fix --extend-exclude .agents,agents/skills .
ruff format --extend-exclude .agents,agents/skills .
mise fmt --all
oxfmt --write '!**/.mise/**' '!**/.agents/**' '!**/agents/skills/**' '!neovim/nvim-pack-lock.json' '!agents/.skill-lock.json' '!pi/settings.json' '!mise.toml' '!mise/conf.d/**'
"""

[tasks.check]
description = "Run all linters and format checks"
output = "summary"
run = """
cd "$REPO_DIR"
mise install node shellcheck shfmt stylua ruff npm:oxfmt npm:oxlint github:fish-shell/fish-shell
sh_files="$(shfmt --find . | git check-ignore -nv --stdin | sed -n 's/^::\t//p')"
echo "$sh_files" | xargs shellcheck -x
echo "$sh_files" | xargs shfmt -d -i 2
{ git ls-files '*.fish'; git grep -l '^#!/.*fish'; } | sort -u | xargs fish --no-execute
stylua --indent-type Spaces --indent-width 2 --check .
ruff check --extend-exclude .agents,agents/skills .
ruff format --check --extend-exclude .agents,agents/skills .
mise fmt --all --check
oxlint --ignore-pattern '.agents/**' --ignore-pattern 'agents/skills/**' .
oxfmt --check '!**/.mise/**' '!**/.agents/**' '!**/agents/skills/**' '!neovim/nvim-pack-lock.json' '!agents/.skill-lock.json' '!pi/settings.json' '!mise.toml' '!mise/conf.d/**'
mise config ls >/dev/null
"""


