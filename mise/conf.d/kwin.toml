# The odsod-daemon session service owns the global shortcuts and their KWin
# script (odsod/daemon ADR-0008). This topic keeps the KWin settings that are
# not shortcuts.
[tasks."kwin:install"]
description = "Configure KWin focus policy and window rules"
depends = ["kwin:configure", "kwin:window-rules"]
run = "echo '[kwin] Done'"

[tasks."kwin:configure"]
description = "Configure KWin window focus policy"
run = """
kwriteconfig6 --file kwinrc --group Windows --key FocusPolicy FocusFollowsMouse
qdbus-qt6 org.kde.KWin /KWin reconfigure
"""

[tasks."kwin:window-rules"]
description = "Configure KWin shadow-only window rules"
run = 'exec "$REPO_DIR/kwin/window-rules.sh"'
