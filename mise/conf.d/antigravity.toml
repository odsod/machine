[dotfiles]
"~/.gemini/config/hooks.json" = "../../antigravity/hooks.json"

[tasks."antigravity:check"]
description = "Check antigravity config drift on repo-managed keys (fails until resolved)"
run = """
repo_view=$(mktemp)
live_view=$(mktemp)
trap 'rm -f "$repo_view" "$live_view"' EXIT
jq -S . "$REPO_DIR/antigravity/settings.json" >"$repo_view"
jq -S --slurpfile ref "$REPO_DIR/antigravity/settings.json" \
  'with_entries(select(.key as $k | $ref[0] | has($k)))' \
  "$HOME/.gemini/antigravity-cli/settings.json" >"$live_view"
if ! diff -u "$repo_view" "$live_view"; then
  echo "[antigravity] Resolve with: mise run antigravity:resolve"
  exit 1
fi
"""

[tasks."antigravity:resolve"]
description = "Resolve antigravity config drift by merging repo keys into the live config"
run = """
merged=$(mktemp)
trap 'rm -f "$merged"' EXIT
jq -S -s '.[0] * .[1]' "$HOME/.gemini/antigravity-cli/settings.json" "$REPO_DIR/antigravity/settings.json" >"$merged"
echo "[antigravity] Applying repo keys over live config"
install -m 600 "$merged" "$HOME/.gemini/antigravity-cli/settings.json"
"""
