[bootstrap.files."/etc/yum.repos.d/tailscale.repo"]
content = """
[tailscale-stable]
name=Tailscale stable
baseurl=https://pkgs.tailscale.com/stable/fedora/$basearch
enabled=1
type=rpm
repo_gpgcheck=1
gpgcheck=1
gpgkey=https://pkgs.tailscale.com/stable/fedora/repo.gpg
"""
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"
replace = true

[bootstrap.packages]
"dnf:tailscale" = "latest"

[bootstrap.services.tailscaled]
state = "running"
enabled = true

# Let the login user run `tailscale serve` and `tailscale funnel` without sudo.
[bootstrap.hooks.post-packages]
run = """
if [ "$(tailscale debug prefs 2>/dev/null | jq -r '.OperatorUser // ""')" != "$USER" ]; then
  sudo tailscale set --operator="$USER"
fi
"""
