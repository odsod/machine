[bootstrap.packages]
"dnf:libva-utils" = "latest"
"dnf:mesa-dri-drivers" = "latest"
"dnf:mesa-vulkan-drivers" = "latest"

[tasks."graphics:setup"]
description = "Install per-host graphics drivers and tweaks"
run = """
case "$(uname -n)" in
odsod-x1-carbon)
  echo "[graphics] Intel Meteor Lake - installing intel-media-driver..."
  sudo dnf install -y -q intel-media-driver
  # i915 loads from the initramfs and waits ~20s for the MEI GSC proxy. The
  # MEI drivers load only after the LUKS prompt, so the proxy fails to init.
  # Load them in the initramfs too.
  conf='force_drivers+=" mei_me mei_gsc_proxy "'
  if [ "$(cat /etc/dracut.conf.d/odsod-gsc-proxy.conf 2>/dev/null)" != "$conf" ]; then
    echo "[graphics] Adding MEI drivers to initramfs..."
    printf '%s\\n' "$conf" | sudo tee /etc/dracut.conf.d/odsod-gsc-proxy.conf > /dev/null
    sudo dracut -f
  fi
  ;;
odsod-desktop)
  # Match the PCI device itself: a drm rule also matches every connector and
  # logs "Could not chase sysfs attribute" for each. Coldplug sends "add" for
  # the bound device, and a later rebind sends "bind".
  echo "[graphics] Radeon dGPU - installing udev perf rule..."
  printf 'ACTION=="add|bind", SUBSYSTEM=="pci", DRIVER=="amdgpu", ATTR{power_dpm_force_performance_level}="high"\\n' \\
    | sudo tee /etc/udev/rules.d/30-amdgpu-perf.rules > /dev/null
  ;;
*)
  echo "[graphics] $(uname -n) is unlisted; nothing to do"
  ;;
esac
"""
