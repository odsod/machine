[dotfiles]
"~/.ssh/config.d/00-machine.conf" = "../../ssh/client.conf"
"~/.config/autostart/ssh-add.desktop" = "../../ssh/ssh-add.desktop"
"~/.config/environment.d/10-ssh-agent.conf" = "../../ssh/environment.conf"

[bootstrap.files."/etc/ssh/sshd_config.d/01-odsod-machine.conf"]
source = "../../ssh/machine.conf"
owner = "root"
group = "root"
mode = "0644"
replace = true
notify = ["sshd"]

[bootstrap.directories."/etc/ssh/authorized_keys.d"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/ssh/authorized_keys.d/odsod"]
source = "../../ssh/authorized_keys"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.packages]
"dnf:openssh-server" = "latest"

[bootstrap.services.sshd]
state = "running"
enabled = true
on_change = "reload_or_restart"
