[vars]
# Tailscale peers that run no herdr-core (space-separated host names).
herdr_skip_machines = "odsod-hx99g"

[dotfiles]
"~/.config/herdr-app/settings.json/repo" = { source = "../../herdr/app/settings.json", merge = "missing" }
"~/.config/herdr-app/keys.json/repo" = { source = "../../herdr/app/keys.json", merge = "missing" }
"~/.config/herdr-app/themes/nord.json" = "../../herdr/app/themes/nord.json"
"~/.config/herdr-app/mods/prefix/main.js" = "../../herdr/app/mods/prefix/main.js"
"~/.config/herdr-app/mods/prefix/mod.json" = "../../herdr/app/mods/prefix/mod.json"
"~/.config/herdr-app/mods/space/main.js" = "../../herdr/app/mods/space/main.js"
"~/.config/herdr-app/mods/space/mod.json" = "../../herdr/app/mods/space/mod.json"
"~/.config/herdr-app/mods/links/main.js" = "../../herdr/app/mods/links/main.js"
"~/.config/herdr-app/mods/links/mod.json" = "../../herdr/app/mods/links/mod.json"
"~/.config/herdr-app/mods/machine/main.js" = "../../herdr/app/mods/machine/main.js"
"~/.config/herdr-app/mods/machine/mod.json" = "../../herdr/app/mods/machine/mod.json"
"~/.config/herdr-app/mods/machine/brain.svg" = "../../herdr/app/mods/machine/brain.svg"
"~/.config/herdr-app/mods/machine/house.svg" = "../../herdr/app/mods/machine/house.svg"
"~/.config/herdr-app/mods/machine/building-2.svg" = "../../herdr/app/mods/machine/building-2.svg"
"~/.local/share/applications/herdr-app.desktop" = "../../herdr/app/herdr-app.desktop"
"~/.local/bin/clone-repo" = "../../herdr/clone-repo"
"~/.local/bin/herdr-space" = "../../herdr/herdr-space"
"~/.local/bin/trust-workspace" = "../../herdr/trust-workspace"
"~/.local/bin/desktop-run" = "../../herdr/desktop-run"
"~/.local/bin/xdg-open" = "../../herdr/xdg-open"
"~/.local/bin/herdr-patch-mods" = "../../herdr/patch-mods"
"~/.local/bin/herdr-relogin" = "../../herdr/herdr-relogin"
"~/.local/bin/herdr-machine-agent" = "../../herdr/machine-agent"
"~/.config/herdr-app-patches" = "../../herdr/app/patches"
"~/.config/systemd/user/herdr-patch-mods.path" = "../../herdr/herdr-patch-mods.path"
"~/.config/systemd/user/herdr-patch-mods.service" = "../../herdr/herdr-patch-mods.service"
"~/.config/systemd/user/herdr-machine-agent.path" = "../../herdr/herdr-machine-agent.path"
"~/.config/systemd/user/herdr-machine-agent.service" = "../../herdr/herdr-machine-agent.service"

[tasks."herdr:sync-machines"]
description = "Save missing Tailscale peers as Herdr machines"
depends = ["herdr:setup-core"]
env = { HERDR_SKIP_MACHINES = "{{vars.herdr_skip_machines}}" }
run = 'exec "$REPO_DIR/herdr/setup-machines.sh"'

[tasks."herdr:setup-core"]
description = "Link hc and herdr-core to the pinned herdr-core and flag a stale core"
run = 'exec "$REPO_DIR/herdr/setup-core.sh"'

[tasks."herdr:patch-mods"]
description = "Rebuild the odsod-* Herdr app mods and layout from upstream plus patches"
run = """
systemctl --user daemon-reload
systemctl --user enable --now herdr-patch-mods.path
HERDR_MOD_PATCHES="$REPO_DIR/herdr/app/patches" exec "$REPO_DIR/herdr/patch-mods"
"""

[tasks."herdr:machine-agent"]
description = "Start the machine agent whenever herdr-core comes up"
run = """
systemctl --user daemon-reload
systemctl --user enable --now herdr-machine-agent.path
"""
