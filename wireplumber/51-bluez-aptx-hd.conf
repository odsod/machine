# Keep Bluetooth audio on aptX HD and never fall back to the mono headset profile.
#
# WirePlumber's "autoswitch to headset profile" moves a Bluetooth card to
# HSP/HFP (mono, narrowband) as soon as an application opens the headset
# microphone, and it does not reliably switch back afterwards. Turning it off
# also stops the headset microphone from being published, so a connected
# headset only ever offers its stereo sink.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  # A2DP: aptX HD only, so nothing negotiates down to AAC or plain aptX.
  # SBC stays available as the mandatory fallback codec.
  # HFP: keep mSBC for the headset profile, in case it is ever selected by hand.
  # Applies to every audio device on hci0.
  bluez5.codecs = [ aptx_hd msbc ]
}
