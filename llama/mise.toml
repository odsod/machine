[vars]
version = "0.2.0"
model = "Qwen3.5-9B-Q5_K_M.gguf"
model_url = "https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q5_K_M.gguf"
embed_model = "Qwen3-Embedding-0.6B-Q8_0.gguf"
embed_model_url = "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf"
port = "8179"
embed_port = "8180"

[tasks.discover]
description = "Show latest stable llama.cpp release version"
run = """
gh api 'repos/ggml-org/llama.cpp/releases?per_page=30' \
  --jq 'first(.[] | select(.prerelease == false) | .tag_name | select(test("^v[0-9]"))) | sub("^v"; "")' \
  || echo UNKNOWN
"""

[tasks.clean]
description = "Remove source trees other than the pinned version"
run = """
for dir in llama.cpp-*; do
  if [ -d "$dir" ] && [ "$dir" != "llama.cpp-{{vars.version}}" ]; then
    echo "[clean] Removing $dir"
    rm -rf "$dir"
  fi
done
"""
