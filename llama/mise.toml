[vars]
version = "0.4.0"
model = "Qwen3.5-9B-Q5_K_M.gguf"
model_url = "https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q5_K_M.gguf"
port = "8179"

[tasks.discover]
description = "Show latest stable llama.cpp release version"
run = """
# Nightly bNNNN releases bury the semver tags past any fixed window,
# so list tags and version-sort instead of scanning recent releases.
git ls-remote --tags https://github.com/ggml-org/llama.cpp.git 'refs/tags/v*' \
  | grep -v '\\^{}$' \
  | sed 's#.*refs/tags/v##' \
  | sort -V \
  | tail -1 \
  || echo UNKNOWN
"""

[tasks.clean]
description = "Remove source trees other than the pinned version"
run = """
for dir in llama.cpp-*; do
  if [ -d "$dir" ] && [ "$dir" != "llama.cpp-{{vars.version}}" ]; then
    echo "[clean] Removing $dir"
    rm -rf "$dir"
  fi
done
"""
